<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali Raza Jatoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f9f7f4;
    --ink: #1c1a18;
    --muted: #9a9590;
    --line: #e2ddd8;
    --accent: #b85c38;
    --serif: 'Lora', Georgia, serif;
    --mono: 'IBM Plex Mono', monospace;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── LAYOUT ── */
  main {
    flex: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 96px 32px 80px;
    width: 100%;
  }

  /* ── INTRO ── */
  .intro {
    margin-bottom: 72px;
    opacity: 0;
    transform: translateY(16px);
    animation: rise 0.7s ease forwards;
  }

  .name {
    font-size: 1.6rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    color: var(--ink);
  }

  .bio {
    font-size: 1.05rem;
    line-height: 1.85;
    color: var(--ink);
    font-weight: 400;
  }

  .bio span.typed {
    border-right: 1.5px solid var(--accent);
    animation: blink 1s step-end infinite;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 32px;
    height: 1px;
    background: var(--line);
    margin: 48px 0;
    opacity: 0;
    animation: rise 0.5s ease 0.6s forwards;
  }

  /* ── FILES ── */
  .files-label {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
    opacity: 0;
    animation: rise 0.5s ease 0.8s forwards;
  }

  .file-list {
    list-style: none;
  }

  .file-item {
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.45s ease forwards;
  }

  .file-item:nth-child(1) { animation-delay: 0.95s; }
  .file-item:nth-child(2) { animation-delay: 1.05s; }
  .file-item:nth-child(3) { animation-delay: 1.15s; }
  .file-item:nth-child(4) { animation-delay: 1.25s; }
  .file-item:nth-child(5) { animation-delay: 1.35s; }
  .file-item:nth-child(6) { animation-delay: 1.45s; }

  .file-link {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--ink);
    transition: color 0.2s;
    cursor: pointer;
  }

  .file-link:hover { color: var(--accent); }
  .file-link:hover .file-arrow { transform: translateX(4px); }

  .file-icon {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    width: 28px;
    flex-shrink: 0;
    transition: color 0.2s;
  }

  .file-link:hover .file-icon { color: var(--accent); }

  .file-name {
    font-size: 0.975rem;
    flex: 1;
    line-height: 1.4;
  }

  .file-meta {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  .file-arrow {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    transition: transform 0.2s, color 0.2s;
    margin-left: 4px;
  }

  .file-link:hover .file-arrow { color: var(--accent); }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 32px;
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    border-top: 1px solid var(--line);
    opacity: 0;
    animation: rise 0.5s ease 1.6s forwards;
  }

  /* ── ANIMATIONS ── */
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes blink {
    0%, 100% { border-color: var(--accent); }
    50% { border-color: transparent; }
  }
</style>
</head>
<body>

<main>
  <div class="intro">
    <div class="name">Ali Raza Jatoi</div>
    <p class="bio" id="bio-text"></p>
  </div>

  <div class="divider"></div>

  <div class="files-label">Works</div>

  <ul class="file-list" id="file-list"></ul>
</main>

<footer>© 2025 Ali Raza Jatoi</footer>

<script>
  // Typewriter bio
  const bioText = "I'm a mathematics researcher from Pakistan. I work on calculus, linear algebra, number theory, and applied mathematics — documenting solutions clearly so others can follow and learn.";
  const bioEl = document.getElementById('bio-text');
  let i = 0;

  function type() {
    if (i < bioText.length) {
      const span = document.createElement('span');
      span.className = 'typed';
      bioEl.appendChild(document.createTextNode(bioText[i]));
      i++;
      // Remove old cursor
      const old = bioEl.querySelector('.typed');
      if (old) old.remove();
      // Add cursor at end
      const cursor = document.createElement('span');
      cursor.className = 'typed';
      cursor.textContent = '';
      bioEl.appendChild(cursor);
      setTimeout(type, i < 10 ? 60 : Math.random() * 30 + 18);
    } else {
      // Remove cursor when done
      const cursor = bioEl.querySelector('.typed');
      if (cursor) setTimeout(() => cursor.remove(), 1200);
    }
  }

  setTimeout(type, 400);

  // Files
  const files = [
    { icon: "pdf", name: "Differential Geometry by Carmo Exercise 3.2", meta: "12 pages", href: "Differential Geometry Exercise 3.2.pdf" },
    { icon: "pdf", name: "Differential Geometry by Carmo Exercise 3.3",        meta: "10 proofs", href: "Differential Geometry Exercise 3.3.pdf" }
  ];

  const list = document.getElementById('file-list');
  files.forEach(f => {
    const li = document.createElement('li');
    li.className = 'file-item';
    li.innerHTML = `
      <a href="${f.href}" class="file-link">
        <span class="file-icon">${f.icon}</span>
        <span class="file-name">${f.name}</span>
        <span class="file-meta">${f.meta}</span>
        <span class="file-arrow">→</span>
      </a>`;
    list.appendChild(li);
  });
</script>
</body>
</html>
