<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ali Raza Jatoi – Mathematics Solutions</title>
<meta name="description" content="Worked solutions in abstract algebra, differential geometry, and nonlinear dynamics and chaos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e5e5e5;
    --hover: #f5f5f5;
    --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151515; --ink: #ececec; --muted: #9a9a9a; --line: #2e2e2e; --hover: #1e1e1e; }
  }

  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 72px 24px 48px; }

  header { margin-bottom: 40px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 2rem; letter-spacing: -0.01em; line-height: 1.2; }
  .bio { margin-top: 12px; color: var(--muted); max-width: 60ch; }
  .tally { margin-top: 8px; font-size: 0.875rem; color: var(--muted); }

  .search {
    display: block; width: 100%; margin-top: 28px;
    padding: 10px 12px; font: inherit; font-size: 0.9375rem;
    color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 4px;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

  details { border-top: 1px solid var(--line); }
  details:last-of-type { border-bottom: 1px solid var(--line); }
  summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 18px 0;
  }
  summary::-webkit-details-marker { display: none; }
  summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .book-title { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; line-height: 1.3; }
  .book-by { display: block; font-family: var(--sans); font-size: 0.875rem; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .book-count { font-size: 0.875rem; color: var(--muted); white-space: nowrap; }
  .book-count::after { content: "+"; display: inline-block; width: 1.2em; text-align: right; }
  details[open] .book-count::after { content: "\2212"; }

  .group { padding: 0 0 16px; }
  .group-name { font-size: 0.875rem; font-weight: 600; margin: 8px 0 4px; }
  ul { list-style: none; }
  li a {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 8px 10px; margin: 0 -10px;
    color: var(--ink); text-decoration: none; border-radius: 4px;
  }
  li a:hover { background: var(--hover); text-decoration: underline; text-underline-offset: 3px; }
  li a:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .pages { color: var(--muted); font-size: 0.875rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .empty { margin-top: 32px; color: var(--muted); }
  footer { max-width: 720px; margin: 0 auto; padding: 24px; font-size: 0.8125rem; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ali Raza Jatoi</h1>
    <p class="bio">I'm a mathematics researcher and teacher. I work on calculus, linear algebra, number theory, and applied mathematics, and I write out solutions clearly so others can follow and learn.</p>
    <p class="tally" id="tally"></p>
    <input class="search" id="search" type="search" placeholder="Search solutions, e.g. Strogatz, chapter 6" aria-label="Search solutions">
  </header>

  <div id="books"></div>
  <p class="empty" id="empty" hidden>No solutions match your search.</p>
</main>

<footer>&copy; <span id="year"></span> Ali Raza Jatoi</footer>

<script>
  const ch = (n, pages, href) => ({ name: 'Chapter ' + n, pages, href });

  const books = [
    {
      title: 'Abstract Algebra: Theory and Applications',
      by: 'Thomas Judson',
      groups: [{
        items: [[10, 9], [11, 11], [12, 11], [13, 11], [14, 14], [15, 9]]
          .map(([n, p]) => ch(n, p, `Judson_s_Abstract_Algebra__Chapter_${n}.pdf`))
      }]
    },
    {
      title: 'Differential Geometry of Curves and Surfaces',
      by: 'Manfredo do Carmo',
      groups: [{
        items: [
          { name: 'Exercise 3.2', pages: 12, href: 'Differential Geometry Exercise 3.2.pdf' },
          { name: 'Exercise 3.3', pages: 10, href: 'Differential Geometry Exercise 3.3.pdf' }
        ]
      }]
    },
    {
      title: 'Chaos: An Introduction to Dynamical Systems',
      by: 'Alligood, Sauer, Yorke',
      groups: [
        {
          name: 'Chapter solutions',
          items: [
            ch(1, 6, 'chaosalligood__ch1_solutions.pdf'),
            ch(2, 5, 'chaosalligood__ch2_solutions.pdf'),
            ch(3, 5, 'chaosalligood_ch3_solutions.pdf'),
            ch(4, 11, 'chaosalligood__ch4_solutions.pdf'),
            ch(5, 10, 'chaosalligood__ch5_solutions.pdf'),
            ch(6, 5, 'chaosalligood_6_solutions.pdf'),
            ch(7, 5, 'chaosalligood_ch7_solutions.pdf'),
            ch(8, 5, 'chaosalligood_ch8_solutions.pdf'),
            ch(9, 4, 'chaosalligood__ch9_solutions.pdf'),
            ch(10, 4, 'chaosalligood__ch10_solutions.pdf'),
            ch(11, 6, 'chaosalligood__ch11_solutions.pdf'),
            ch(12, 4, 'chaosalligood__ch12_solutions.pdf')
          ]
        },
        {
          name: 'Challenges',
          items: [
            { name: 'Chapters 1 and 2', pages: 6, href: 'chaos_challenge_chapter1_2.pdf' },
            { name: 'Chapters 3\u20135 and 11\u201313', pages: 22, href: 'chaos_challenge_chapter3_5_11_13.pdf' },
            ch(6, 4, 'chaos_challenge_chapter6_solution.pdf'),
            ch(7, 9, 'chaos_challenge_chapter7_solution.pdf'),
            ch(8, 7, 'chaos_challenge_chapter8_solution.pdf'),
            ch(9, 7, 'chaos_challenge_chapter9_solution.pdf'),
            ch(10, 6, 'chaos_challenge_chapter10_solution.pdf')
          ]
        }
      ]
    },
    {
      title: 'Nonlinear Dynamics and Chaos',
      by: 'Steven Strogatz',
      groups: [{
        items: [[2, 26], [3, 36], [4, 22], [5, 16], [6, 54], [7, 34], [8, 28], [9, 20], [10, 25], [11, 14], [12, 21]]
          .map(([n, p]) => ch(n, p, `Strogatz_chapter${n}.pdf`))
      }]
    }
  ];

  const root = document.getElementById('books');
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let totalFiles = 0, totalPages = 0;

  books.forEach(book => {
    const all = book.groups.flatMap(g => g.items);
    const pages = all.reduce((s, f) => s + f.pages, 0);
    totalFiles += all.length; totalPages += pages;

    const d = document.createElement('details');
    d.innerHTML =
      `<summary><span class="book-title">${esc(book.title)}<span class="book-by">${esc(book.by)}</span></span>` +
      `<span class="book-count">${all.length} files, ${pages} pages</span></summary>` +
      book.groups.map(g =>
        `<div class="group">${g.name ? `<div class="group-name">${esc(g.name)}</div>` : ''}<ul>` +
        g.items.map(f =>
          `<li data-text="${esc((book.title + ' ' + book.by + ' ' + (g.name || '') + ' ' + f.name).toLowerCase())}">` +
          `<a href="${encodeURI(f.href)}"><span>${esc(f.name)}</span><span class="pages">${f.pages} pp</span></a></li>`
        ).join('') + `</ul></div>`
      ).join('');
    root.appendChild(d);
  });

  document.getElementById('tally').textContent = `${totalFiles} solution sets, ${totalPages} pages in total.`;
  document.getElementById('year').textContent = new Date().getFullYear();

  // Search: hide non-matching items, open sections that have matches
  const search = document.getElementById('search');
  const empty = document.getElementById('empty');
  search.addEventListener('input', () => {
    const terms = search.value.toLowerCase().split(/\s+/).filter(Boolean);
    let anyShown = false;
    root.querySelectorAll('details').forEach(d => {
      let shown = 0;
      d.querySelectorAll('li').forEach(li => {
        const hit = terms.every(t => li.dataset.text.includes(t));
        li.hidden = !hit; if (hit) shown++;
      });
      d.querySelectorAll('.group').forEach(g => { g.hidden = !g.querySelector('li:not([hidden])'); });
      d.hidden = shown === 0;
      d.open = terms.length > 0 && shown > 0;
      if (shown) anyShown = true;
    });
    empty.hidden = anyShown;
  });
</script>
</body>
</html>
